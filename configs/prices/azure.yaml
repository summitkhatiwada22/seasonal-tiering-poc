# Azure Blob Storage price sheet (East US 2, LRS, flat namespace, general-purpose v2). All prices in USD.
#
# status: sourced     -> the value appears in an official Microsoft source listed under _sources.
# status: unverified  -> not yet checked against an official source (none left in this file).
#
# VERIFICATION (2026-10-30). Every price below was read from Microsoft's Azure Retail Prices API
# (product "General Block Blob v2", region eastus2, pay-as-you-go), the official machine-readable
# price list. The rows are copied in docs/evidence/official-prices-2026-10-30.md. They match the
# owner's screenshots of 2026-10-29 exactly. The API quotes operations per 10,000; this sheet stores
# per 1,000 (divide by 10). Rules (minimum days, rehydration time) come from Microsoft Learn and
# the official pricing page.
#
# Correction made by this verification (decision D-025): min_billable_object_kb for Cool, Cold and
# Archive was 128 (from a secondary article). Neither the official pricing page nor Microsoft's
# access-tier documentation lists any minimum billable object size; the only 128 KiB rule on the
# pricing page is for "smart tier" monitoring. Set to 0.
#
# Phase 3 addition (D-026): archived blobs carry up to 8 KB of metadata stored outside the archive tier.
# Microsoft Learn says it is billed at the cool tier rate (access-tiers page) and, elsewhere, that it is
# stored in the cold tier (cost-planning page). The simulator uses the cool rate, the higher of the two.
#
# Note for Phase 4: Azure "smart tier" (automatic hot/cool/cold tiering, a monitoring fee per 10,000
# objects over 128 KiB) is Azure's reactive rival. The pricing page says it is available only for
# ZRS, GZRS and RA-GZRS, so it has no price for this LRS sheet.
#
# Tiered Hot prices for large volumes (0.017664 from 50 TB, 0.016928 from 500 TB) are listed under
# extras but not modelled yet.

_sources:
  azure_retail_api: &azure_retail_api "https://prices.azure.com/api/retail/prices?$filter=serviceName eq 'Storage' and armRegionName eq 'eastus2' and productName eq 'General Block Blob v2' and priceType eq 'Consumption'"  # read 2026-10-30
  azure_bandwidth_api: &azure_bandwidth_api "https://prices.azure.com/api/retail/prices?$filter=serviceName eq 'Bandwidth' and armRegionName eq 'eastus2' and priceType eq 'Consumption'"  # read 2026-10-30
  azure_pricing_page: &azure_pricing_page https://azure.microsoft.com/en-us/pricing/details/storage/blobs/  # read 2026-10-30
  azure_access_tiers: &azure_access_tiers https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview  # read 2026-10-30
  azure_rehydrate: &azure_rehydrate https://learn.microsoft.com/en-us/azure/storage/blobs/archive-rehydrate-overview  # read 2026-10-30 (Phase 3)
  azure_plan_costs: &azure_plan_costs https://learn.microsoft.com/en-us/azure/storage/common/storage-plan-manage-costs  # read 2026-10-30 (Phase 3)
  owner_screenshots: &owner_screenshots https://github.com/summitkhatiwada22/seasonal-tiering-poc/tree/main/docs/evidence  # 2026-10-29, agree with the API

cloud: azure
region: East US 2, LRS, flat namespace
currency: USD
as_of: 2026-10-30

tier_order: [hot, cool, cold, archive]

tiers:
  hot:
    storage_usd_per_gb_month: {value: 0.0184, status: sourced, source: *azure_retail_api}   # first 50 TB
    retrieval_usd_per_gb: {value: 0.0, status: sourced, source: *azure_retail_api}         # no retrieval meter for Hot
    min_storage_days: {value: 0, status: sourced, source: *azure_access_tiers}             # "N/A"
    min_billable_object_kb: {value: 0, status: sourced, source: *azure_pricing_page}       # none listed
    per_object_overhead_kb: {value: 0, status: sourced, source: *azure_pricing_page}       # none listed
    restore_hours: {value: 0, status: sourced, source: *azure_access_tiers}                # latency "Milliseconds"
    put_per_1000: {value: 0.005, status: sourced, source: *azure_retail_api}               # $0.05 per 10,000 writes
    get_per_1000: {value: 0.0004, status: sourced, source: *azure_retail_api}              # $0.004 per 10,000 reads
  cool:
    storage_usd_per_gb_month: {value: 0.010, status: sourced, source: *azure_retail_api}
    retrieval_usd_per_gb: {value: 0.01, status: sourced, source: *azure_retail_api}
    min_storage_days: {value: 30, status: sourced, source: *azure_access_tiers}
    min_billable_object_kb: {value: 0, status: sourced, source: *azure_pricing_page}       # corrected from 128 (D-025)
    per_object_overhead_kb: {value: 0, status: sourced, source: *azure_pricing_page}
    restore_hours: {value: 0, status: sourced, source: *azure_access_tiers}                # "Milliseconds"
    put_per_1000: {value: 0.01, status: sourced, source: *azure_retail_api}                # $0.10 per 10,000
    get_per_1000: {value: 0.001, status: sourced, source: *azure_retail_api}               # $0.01 per 10,000
  cold:
    storage_usd_per_gb_month: {value: 0.0036, status: sourced, source: *azure_retail_api}
    retrieval_usd_per_gb: {value: 0.03, status: sourced, source: *azure_retail_api}
    min_storage_days: {value: 90, status: sourced, source: *azure_access_tiers}
    min_billable_object_kb: {value: 0, status: sourced, source: *azure_pricing_page}       # corrected from 128 (D-025)
    per_object_overhead_kb: {value: 0, status: sourced, source: *azure_pricing_page}
    restore_hours: {value: 0, status: sourced, source: *azure_access_tiers}                # "Milliseconds"
    put_per_1000: {value: 0.018, status: sourced, source: *azure_retail_api}               # $0.18 per 10,000
    get_per_1000: {value: 0.01, status: sourced, source: *azure_retail_api}                # $0.10 per 10,000
  archive:
    storage_usd_per_gb_month: {value: 0.002, status: sourced, source: *azure_retail_api}
    retrieval_usd_per_gb: {value: 0.02, status: sourced, source: *azure_retail_api}        # standard priority rehydration
    min_storage_days: {value: 180, status: sourced, source: *azure_access_tiers}
    min_billable_object_kb: {value: 0, status: sourced, source: *azure_pricing_page}       # corrected from 128 (D-025)
    per_object_overhead_kb: {value: 8, status: sourced, source: *azure_plan_costs}         # archived-blob metadata "doesn't exceed 8 KB", billed at a cooler online tier's rate (Phase 3, D-026)
    restore_hours: {value: 15, status: sourced, source: *azure_access_tiers}               # "can take up to 15 hours"
    priority_restore_hours: {value: 1, status: sourced, source: *azure_rehydrate}         # high priority "might complete in less than one hour" (objects under 10 GB)
    put_per_1000: {value: 0.01, status: sourced, source: *azure_retail_api}                # $0.10 per 10,000
    get_per_1000: {value: 0.5, status: sourced, source: *azure_retail_api}                 # $5 per 10,000
    retrieval_priority_usd_per_gb: {value: 0.10, status: sourced, source: *azure_retail_api}  # high-priority rehydration
    get_priority_per_1000: {value: 5.0, status: sourced, source: *azure_retail_api}           # $50 per 10,000

extras:
  # Internet egress, Microsoft global network routing (the default), first 10 TB after 100 GB free.
  egress_usd_per_gb_first_tier: {value: 0.087, status: sourced, source: *azure_bandwidth_api}
  hot_storage_from_50tb_usd_per_gb_month: {value: 0.017664, status: sourced, source: *azure_retail_api}
  hot_storage_from_500tb_usd_per_gb_month: {value: 0.016928, status: sourced, source: *azure_retail_api}
