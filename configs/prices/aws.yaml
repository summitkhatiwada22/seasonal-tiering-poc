# AWS S3 price sheet, US East (N. Virginia), us-east-1. All prices in USD.
#
# HOW TO READ THIS FILE
#   status: sourced     -> the value appears in an official AWS page or data file listed under _sources.
#   status: unverified  -> not yet checked against an official source (none left in this file).
# Every number the simulator uses comes from this file, never from code.
#
# VERIFICATION (2026-10-30). Every value below was read from AWS's own sources:
#   * The official S3 pricing page, rendered in a real browser with Region = US East (N. Virginia).
#     Its tables are filled from AWS's price data file (publication date 2026-10-15). The rows read
#     are copied word for word in docs/evidence/official-prices-2026-10-30.md.
#   * AWS S3 User Guide pages for restore times, storage-class minimums and Intelligent-Tiering rules.
# The owner's AWS Pricing Calculator readings (2026-10-29 and 2026-10-30) agree with these values;
# tests/test_prices.py reproduces each calculator total from this file.
#
# UNITS. AWS bills storage in binary gigabytes: 1 GB = 2^30 bytes (official page, "S3 Pricing
# Details"). The simulator must convert bytes with 2^30, not 10^9.
#
# Changes made by this verification (decision D-025):
#   * glacier_flexible.restore_hours 4 -> 5: the docs give "3-5 hours"; we use the upper end of every
#     stated range, as already done for Deep Archive ("within 12 hours", bulk "within 48 hours").
#   * Added restore-request fees, bulk and expedited options, transition fees for every class,
#     Standard volume tiers and the Intelligent-Tiering prices and rules.

_sources:
  aws_pricing_page: &aws_pricing_page https://aws.amazon.com/s3/pricing/  # rendered 2026-10-30, Region US East (N. Virginia)
  aws_price_data: &aws_price_data https://b0.p.awsstatic.com/pricing/2.0/meteredUnitMaps/s3/USD/current/s3.json  # data behind the page, published 2026-10-15
  aws_storage_classes: &aws_storage_classes https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html  # read 2026-10-30
  aws_retrieval_options: &aws_retrieval_options https://docs.aws.amazon.com/AmazonS3/latest/userguide/restoring-objects-retrieval-options.html  # read 2026-10-30
  aws_intelligent_tiering: &aws_intelligent_tiering https://docs.aws.amazon.com/AmazonS3/latest/userguide/intelligent-tiering-overview.html  # read 2026-10-30

cloud: aws
region: us-east-1
currency: USD
as_of: 2026-10-30

# Hot to cold. Storage price must not increase along this list (checked by tests).
tier_order: [standard, standard_ia, glacier_instant, glacier_flexible, deep_archive]

tiers:
  standard:
    storage_usd_per_gb_month: {value: 0.023, status: sourced, source: *aws_pricing_page}   # first 50 TB / month
    retrieval_usd_per_gb: {value: 0.0, status: sourced, source: *aws_pricing_page}       # "n/a"
    min_storage_days: {value: 0, status: sourced, source: *aws_storage_classes}           # "None"
    min_billable_object_kb: {value: 0, status: sourced, source: *aws_storage_classes}     # "None"
    per_object_overhead_kb: {value: 0, status: sourced, source: *aws_pricing_page}
    restore_hours: {value: 0, status: sourced, source: *aws_storage_classes}              # millisecond access
    put_per_1000: {value: 0.005, status: sourced, source: *aws_pricing_page}
    get_per_1000: {value: 0.0004, status: sourced, source: *aws_pricing_page}
  standard_ia:
    storage_usd_per_gb_month: {value: 0.0125, status: sourced, source: *aws_pricing_page}
    retrieval_usd_per_gb: {value: 0.01, status: sourced, source: *aws_pricing_page}
    min_storage_days: {value: 30, status: sourced, source: *aws_pricing_page}
    min_billable_object_kb: {value: 128, status: sourced, source: *aws_pricing_page}
    per_object_overhead_kb: {value: 0, status: sourced, source: *aws_pricing_page}
    restore_hours: {value: 0, status: sourced, source: *aws_storage_classes}              # millisecond access
    put_per_1000: {value: 0.01, status: sourced, source: *aws_pricing_page}
    get_per_1000: {value: 0.001, status: sourced, source: *aws_pricing_page}
    transition_in_per_1000: {value: 0.01, status: sourced, source: *aws_pricing_page}
  glacier_instant:
    storage_usd_per_gb_month: {value: 0.004, status: sourced, source: *aws_pricing_page}
    retrieval_usd_per_gb: {value: 0.03, status: sourced, source: *aws_pricing_page}
    min_storage_days: {value: 90, status: sourced, source: *aws_pricing_page}
    min_billable_object_kb: {value: 128, status: sourced, source: *aws_pricing_page}
    per_object_overhead_kb: {value: 0, status: sourced, source: *aws_pricing_page}
    restore_hours: {value: 0, status: sourced, source: *aws_retrieval_options}            # "immediately available using GET"
    put_per_1000: {value: 0.02, status: sourced, source: *aws_pricing_page}
    get_per_1000: {value: 0.01, status: sourced, source: *aws_pricing_page}
    transition_in_per_1000: {value: 0.02, status: sourced, source: *aws_pricing_page}
  glacier_flexible:
    storage_usd_per_gb_month: {value: 0.0036, status: sourced, source: *aws_pricing_page}
    retrieval_usd_per_gb: {value: 0.01, status: sourced, source: *aws_pricing_page}       # Standard retrieval
    restore_request_per_1000: {value: 0.05, status: sourced, source: *aws_pricing_page}   # Standard retrieval requests
    retrieval_bulk_usd_per_gb: {value: 0.0, status: sourced, source: *aws_pricing_page}   # "Bulk data retrievals and requests are free"
    restore_request_bulk_per_1000: {value: 0.0, status: sourced, source: *aws_pricing_page}
    retrieval_expedited_usd_per_gb: {value: 0.03, status: sourced, source: *aws_pricing_page}
    restore_request_expedited_per_1000: {value: 10.0, status: sourced, source: *aws_pricing_page}
    min_storage_days: {value: 90, status: sourced, source: *aws_pricing_page}
    min_billable_object_kb: {value: 0, status: sourced, source: *aws_storage_classes}     # "NA"; the 40 KB overhead applies instead
    per_object_overhead_kb: {value: 40, status: sourced, source: *aws_pricing_page}       # 8 KB at Standard rate + 32 KB at this rate
    restore_hours: {value: 5, status: sourced, source: *aws_retrieval_options}            # Standard: "3-5 hours" (upper end, D-025)
    restore_hours_low: {value: 3, status: sourced, source: *aws_retrieval_options}        # lower end of "3-5 hours"
    bulk_restore_hours: {value: 12, status: sourced, source: *aws_retrieval_options}      # Bulk: "5-12 hours"
    bulk_restore_hours_low: {value: 5, status: sourced, source: *aws_retrieval_options}
    expedited_restore_hours: {value: 0.0833, status: sourced, source: *aws_retrieval_options}  # "1-5 minutes" (objects under 250 MB)
    expedited_restore_hours_low: {value: 0.0167, status: sourced, source: *aws_retrieval_options}  # 1 minute
    put_per_1000: {value: 0.03, status: sourced, source: *aws_pricing_page}
    get_per_1000: {value: 0.0004, status: sourced, source: *aws_pricing_page}
    transition_in_per_1000: {value: 0.03, status: sourced, source: *aws_pricing_page}
  deep_archive:
    storage_usd_per_gb_month: {value: 0.00099, status: sourced, source: *aws_pricing_page}
    retrieval_usd_per_gb: {value: 0.02, status: sourced, source: *aws_pricing_page}       # Standard retrieval
    restore_request_per_1000: {value: 0.10, status: sourced, source: *aws_pricing_page}
    retrieval_bulk_usd_per_gb: {value: 0.0025, status: sourced, source: *aws_pricing_page}
    restore_request_bulk_per_1000: {value: 0.025, status: sourced, source: *aws_pricing_page}
    min_storage_days: {value: 180, status: sourced, source: *aws_pricing_page}
    min_billable_object_kb: {value: 0, status: sourced, source: *aws_storage_classes}     # "NA"; the 40 KB overhead applies instead
    per_object_overhead_kb: {value: 40, status: sourced, source: *aws_pricing_page}       # 8 KB at Standard rate + 32 KB at this rate
    restore_hours: {value: 12, status: sourced, source: *aws_retrieval_options}           # Standard: "within 12 hours"
    bulk_restore_hours: {value: 48, status: sourced, source: *aws_retrieval_options}      # Bulk: "within 48 hours"
    put_per_1000: {value: 0.05, status: sourced, source: *aws_pricing_page}
    get_per_1000: {value: 0.0004, status: sourced, source: *aws_pricing_page}
    transition_in_per_1000: {value: 0.05, status: sourced, source: *aws_pricing_page}

extras:
  # S3 Standard volume tiers (the simulator's archives stay under 50 TB unless stated otherwise).
  standard_storage_next_450tb_usd_per_gb_month: {value: 0.022, status: sourced, source: *aws_pricing_page}
  standard_storage_over_500tb_usd_per_gb_month: {value: 0.021, status: sourced, source: *aws_pricing_page}
  # Data transfer out to the internet, first 10 TB per month (first 100 GB per month free across AWS).
  egress_usd_per_gb_first_tier: {value: 0.09, status: sourced, source: *aws_pricing_page}

  # S3 Intelligent-Tiering, the main reactive rival. Same request prices as Standard; no retrieval
  # fees; standard and bulk restores from its archive tiers are free; no minimum storage duration.
  intelligent_tiering_monitoring_per_1000_objects: {value: 0.0025, status: sourced, source: *aws_pricing_page}  # per month, objects > 128 KB
  intelligent_tiering_min_object_kb: {value: 128, status: sourced, source: *aws_intelligent_tiering}  # smaller objects stay in Frequent Access, no monitoring fee
  intelligent_tiering_min_storage_days: {value: 0, status: sourced, source: *aws_storage_classes}
  intelligent_tiering_frequent_usd_per_gb_month: {value: 0.023, status: sourced, source: *aws_pricing_page}  # first 50 TB
  intelligent_tiering_infrequent_usd_per_gb_month: {value: 0.0125, status: sourced, source: *aws_pricing_page}
  intelligent_tiering_archive_instant_usd_per_gb_month: {value: 0.004, status: sourced, source: *aws_pricing_page}
  intelligent_tiering_archive_access_usd_per_gb_month: {value: 0.0036, status: sourced, source: *aws_pricing_page}  # optional tier
  intelligent_tiering_deep_archive_access_usd_per_gb_month: {value: 0.00099, status: sourced, source: *aws_pricing_page}  # optional tier
  intelligent_tiering_put_per_1000: {value: 0.005, status: sourced, source: *aws_pricing_page}
  intelligent_tiering_get_per_1000: {value: 0.0004, status: sourced, source: *aws_pricing_page}
  intelligent_tiering_transition_in_per_1000: {value: 0.01, status: sourced, source: *aws_pricing_page}
  intelligent_tiering_days_to_infrequent: {value: 30, status: sourced, source: *aws_intelligent_tiering}  # consecutive days without access
  intelligent_tiering_days_to_archive_instant: {value: 90, status: sourced, source: *aws_intelligent_tiering}
  intelligent_tiering_archive_access_min_days: {value: 90, status: sourced, source: *aws_intelligent_tiering}  # optional, configurable up to 730
  intelligent_tiering_deep_archive_access_min_days: {value: 180, status: sourced, source: *aws_intelligent_tiering}  # optional, configurable up to 730
  intelligent_tiering_archive_overhead_kb: {value: 40, status: sourced, source: *aws_pricing_page}  # 8 KB Standard + 32 KB archive rate, per archived object
  # Restore times from the two optional archive tiers (standard retrieval; free of charge).
  intelligent_tiering_archive_access_restore_hours: {value: 5, status: sourced, source: *aws_intelligent_tiering}  # "can range from 3-5 hours"
  intelligent_tiering_archive_access_restore_hours_low: {value: 3, status: sourced, source: *aws_intelligent_tiering}
  intelligent_tiering_deep_archive_access_restore_hours: {value: 12, status: sourced, source: *aws_intelligent_tiering}  # "within 12 hours"
