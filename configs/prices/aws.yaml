# AWS S3 price sheet (US East, N. Virginia). All prices in USD.
#
# HOW TO READ THIS FILE
#   status: sourced     -> the value appears in a page listed under _sources.
#   status: unverified  -> written from memory; must be checked against AWS's own
#                          pricing page in Phase 1 before any result is published.
# Every number the simulator uses comes from this file, never from code.
#
# Phase 1 check (2026-10-29): AWS's own page was fetched. Its price tables are drawn by script and
# did not render here, so per-GB rates are STILL from secondary articles. The page's text did confirm
# minimum storage durations (IA 30, Glacier IR/FR 90, Deep Archive 180 days), the 128 KB minimum
# billable size, the 40 KB archive metadata overhead and Standard GET $0.0004 per 1,000.
# Owner's AWS Pricing Calculator readings (2026-10-29, 10 GB per month, rounded to cents by the
# calculator, data transfer switched on): Standard 0.02, Glacier Instant 0.04, Glacier Flexible 0.04,
# Deep Archive 0.01. These agree with the sheet within rounding (0.023 / 0.004 / 0.0036 / 0.00099
# per GB) but cannot confirm the third decimal. TO DO: re-read at 10,000 GB for exact figures.
#
# Cross-check 2026-10-29 (second attempt, still no official tables): two more secondary pages
# (cloudforecast.io, nops.io) agree with the storage rates above ($0.023 / 0.0125 / 0.004 / 0.0036 /
# 0.00099) and one lists lifecycle-transition fees of 0.01 / 0.02 / 0.03 / 0.05 per 1,000 for IA /
# Glacier IR / Glacier FR / Deep Archive, matching the put_per_1000 values below. NOT confirmed:
# per-GB retrieval and per-1,000 GET fees (the pages give none), and the separate per-1,000
# Glacier retrieval-request fee (one page says 0.05 FR-standard, 0.10 Deep Archive; unverified and
# not modelled). The official price tables are script-drawn and the pricing API is blocked here.
# Resolve with the owner's calculator readings before Gate G2.
#
# Owner's calculator reading 2026-10-30 (us-east-1, Glacier Flexible Retrieval, 10,000 GB stored,
# 16 MB average object, 1,000 GB Standard retrieval, no requests entered, data transfer on):
# total $46.18 per month. It reproduces to the cent from storage 0.0036, standard retrieval
# 0.01 per GB and 40 KB overhead per object (32 KB at the Glacier rate, 8 KB at the Standard
# rate): see tests/test_prices.py. Screenshots in docs/evidence/. Request fees were not entered,
# so per-request prices are still unconfirmed.
#
# Owner's calculator reading 2026-10-30, Deep Archive (100,000 GB stored, 16 MB average object,
# 1,000 GB Standard retrieval, no requests): total $120.32 = 99.00 storage (0.00099) + 20.00
# retrieval (0.02 per GB) + about 1.32 for 40 KB per object overhead. Reproduced in
# tests/test_prices.py. Bulk retrieval (0.0025) and request fees were not entered.
#
# Owner's calculator reading 2026-10-30, Standard (10,000 GB, no requests): total $230.70 =
# 230.00 storage (0.023 per GB) + 0.70 for 1,000 GB returned by S3 Select (0.0007 per GB; not used
# by this project). Standard has no retrieval fee, so the sheet's 0.0 retrieval is consistent.
# Request fees were not entered.
#
# Owner's calculator reading 2026-10-30, Glacier Instant Retrieval (10,000 GB, 1,000 GB retrieved,
# no requests): total $70.00 = 40.00 storage (0.004) + 30.00 retrieval (0.03 per GB). The
# calculator showed no object-size or overhead line for this class. Request fees not entered.
#
# Owner's calculator reading 2026-10-30, Standard-IA (10,000 GB, no requests): total $135.00. The
# 1,000 GB was typed into the S3 Select "data returned" box, not the retrieval box. 135.00 =
# 125.00 storage (0.0125 per GB, so storage is consistent) + 10.00 for 1,000 GB at 0.01 per GB,
# which equals the sheet's retrieval price but was not isolated. TO DO: repeat with the retrieval
# box filled and Show Details open.
#
# STILL UNCONFIRMED after the calculator readings (2026-10-30): Standard-IA retrieval (see above), every
# per-1,000 request fee (PUT and GET) for every class, Bulk retrieval, the Glacier restore-request
# fees, and all S3 Intelligent-Tiering prices (the main rival policy).
#
# as_of is the date this sheet was compiled. The sources are secondary articles
# dated 2026-03 to 2026-05, NOT AWS's own price page.

_sources:
  devto_2026: &devto_2026 https://dev.to/mr_manushukla/cloud-storage-pricing-in-2026-aws-s3-vs-azure-vs-gcp-compared-e54
  usage_glacier: &usage_glacier https://www.usage.ai/blogs/aws/storage-cost/glacier-deep-archive-pricing/
  upstash: &upstash https://upstash.com/blog/aws-s3-pricing-explained-2026
  zop: &zop https://dev.to/zop_8abedcc7e12/s3-storage-class-automation-stop-paying-hot-prices-for-cold-data-45oi
  oneuptime_it: &oneuptime_it https://oneuptime.com/blog/post/2026-02-12-s3-intelligent-tiering-optimize-storage-costs/view
  aws_official: &aws_official https://aws.amazon.com/s3//pricing  # fetched 2026-10-29; text rules only, price tables did not render
  memory: &memory "memory: not yet checked against a source; verify in Phase 1"

cloud: aws
region: us-east-1
currency: USD
as_of: 2026-10-29

# Hot to cold. Storage price must not increase along this list (checked by tests).
tier_order: [standard, standard_ia, glacier_instant, glacier_flexible, deep_archive]

tiers:
  standard:
    # First 50 TB per month; $0.022 next 450 TB, $0.021 above 500 TB (tiered pricing is not modelled yet).
    storage_usd_per_gb_month: {value: 0.023, status: sourced, source: *devto_2026}
    retrieval_usd_per_gb: {value: 0.0, status: sourced, source: *zop}
    min_storage_days: {value: 0, status: sourced, source: *zop}
    min_billable_object_kb: {value: 0, status: sourced, source: *zop}
    per_object_overhead_kb: {value: 0, status: sourced, source: *zop}
    restore_hours: {value: 0, status: sourced, source: *zop}
    put_per_1000: {value: 0.005, status: unverified, source: *memory}
    get_per_1000: {value: 0.0004, status: sourced, source: *aws_official}
  standard_ia:
    storage_usd_per_gb_month: {value: 0.0125, status: sourced, source: *devto_2026}
    retrieval_usd_per_gb: {value: 0.01, status: unverified, source: *memory}
    min_storage_days: {value: 30, status: sourced, source: *aws_official}
    min_billable_object_kb: {value: 128, status: sourced, source: *aws_official}
    per_object_overhead_kb: {value: 0, status: unverified, source: *memory}
    restore_hours: {value: 0, status: sourced, source: *zop}
    put_per_1000: {value: 0.01, status: unverified, source: *memory}
    get_per_1000: {value: 0.001, status: unverified, source: *memory}
  glacier_instant:
    storage_usd_per_gb_month: {value: 0.004, status: sourced, source: *devto_2026}
    retrieval_usd_per_gb: {value: 0.03, status: sourced, source: *usage_glacier}
    min_storage_days: {value: 90, status: sourced, source: *aws_official}
    min_billable_object_kb: {value: 128, status: sourced, source: *aws_official}
    per_object_overhead_kb: {value: 0, status: unverified, source: *memory}
    restore_hours: {value: 0, status: sourced, source: *zop}
    put_per_1000: {value: 0.02, status: unverified, source: *memory}
    get_per_1000: {value: 0.01, status: unverified, source: *memory}
  glacier_flexible:
    storage_usd_per_gb_month: {value: 0.0036, status: sourced, source: *devto_2026}
    retrieval_usd_per_gb: {value: 0.01, status: sourced, source: *zop}   # standard retrieval
    min_storage_days: {value: 90, status: sourced, source: *aws_official}
    min_billable_object_kb: {value: 0, status: unverified, source: *memory}
    per_object_overhead_kb: {value: 40, status: sourced, source: *aws_official}
    restore_hours: {value: 4, status: sourced, source: *zop}   # source says 3-5 hours
    put_per_1000: {value: 0.03, status: unverified, source: *memory}
    get_per_1000: {value: 0.0004, status: unverified, source: *memory}
  deep_archive:
    storage_usd_per_gb_month: {value: 0.00099, status: sourced, source: *devto_2026}
    retrieval_usd_per_gb: {value: 0.02, status: sourced, source: *upstash}   # standard retrieval, 12 hours
    retrieval_bulk_usd_per_gb: {value: 0.0025, status: sourced, source: *upstash}
    min_storage_days: {value: 180, status: sourced, source: *aws_official}
    min_billable_object_kb: {value: 0, status: unverified, source: *memory}
    per_object_overhead_kb: {value: 40, status: sourced, source: *aws_official}
    restore_hours: {value: 12, status: sourced, source: *usage_glacier}
    bulk_restore_hours: {value: 48, status: sourced, source: *usage_glacier}
    put_per_1000: {value: 0.05, status: sourced, source: *upstash}
    get_per_1000: {value: 0.0004, status: sourced, source: *upstash}
    transition_in_per_1000: {value: 0.05, status: sourced, source: *upstash}

extras:
  # Data transfer out to the internet, first 10 TB per month.
  egress_usd_per_gb_first_tier: {value: 0.09, status: sourced, source: *upstash}
  # S3 Intelligent-Tiering. Move rules (30 / 90 / 180 days) live in the Phase 4 policy code.
  intelligent_tiering_monitoring_per_1000_objects: {value: 0.0025, status: sourced, source: *oneuptime_it}
  intelligent_tiering_min_object_kb: {value: 128, status: sourced, source: *oneuptime_it}
